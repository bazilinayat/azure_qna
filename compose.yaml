services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: azurementor-qdrant

    ports:
      # REST API
      - "6333:6333"
      # gRPC API — markedly faster for bulk upserts, see QDRANT_PREFER_GRPC
      - "6334:6334"

    volumes:
      - ./qdrant_data:/qdrant/storage

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: azurementor-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    restart: unless-stopped

volumes:
  grafana-storage:
